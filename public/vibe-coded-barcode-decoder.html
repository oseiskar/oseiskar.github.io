<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Decoder</title>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.js"></script>

<style>
:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --border: #dbe3ee;
    --text: #1f2937;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success-bg: #ecfdf5;
    --success-border: #a7f3d0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
}

.card {
    background: var(--card);
    border-radius: 18px;
    padding: 18px;
    box-shadow:
        0 1px 2px rgba(0,0,0,.05),
        0 10px 30px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 1.6rem;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 16px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
}

button,
input[type=file] {
    min-height: 44px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

button:hover:not(:disabled) {
    background: var(--primary-hover);
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

button.secondary {
    background: #64748b;
}

button.secondary:hover:not(:disabled) {
    background: #475569;
}

.canvas-wrap {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    max-width: 100%;
    background: white;
}

canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
}

.status {
    margin-top: 12px;
    color: var(--muted);
    font-size: .95rem;
}

.result-card {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--success-border);
    background: var(--success-bg);
    display: none;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.result-label {
    color: var(--muted);
    font-size: .85rem;
    margin-bottom: 4px;
}

.result-code {
    font-size: 1.05rem;
    font-weight: 700;
    word-break: break-all;
    line-height: 1.4;
}

.result-format {
    margin-top: 8px;
    color: var(--muted);
    font-size: .9rem;
}

.copy-btn {
    flex-shrink: 0;
}

.error-box {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #fecaca;
    background: #fef2f2;
    color: #991b1b;
    display: none;
}

@media (max-width: 700px) {
    .result-header {
        flex-direction: column;
        align-items: stretch;
    }

    .copy-btn {
        width: 100%;
    }

    button {
        flex: 1 1 auto;
    }
}
</style>
</head>
<body>

<div class="app">
    <div class="card">

        <h1>Barcode Decoder</h1>

        <div class="subtitle">
            Upload an image and optionally drag a rectangle around the barcode.
            If no region is selected, the whole image is scanned.
        </div>

        <div class="toolbar">
            <input type="file" id="fileInput" accept="image/*">

            <button id="decodeBtn">
                Decode
            </button>

            <button id="clearBtn" class="secondary">
                Clear Selection
            </button>
        </div>

        <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
        </div>

        <div id="status" class="status">
            No image loaded.
        </div>

        <div id="resultCard" class="result-card">
            <div class="result-header">

                <div>
                    <div class="result-label">
                        Decoded value
                    </div>

                    <div id="decodedText"
                         class="result-code"></div>

                    <div id="decodedFormat"
                         class="result-format"></div>
                </div>

                <button id="copyBtn"
                        class="copy-btn">
                    Copy
                </button>

            </div>
        </div>

        <div id="errorBox"
             class="error-box"></div>

    </div>
</div>

<script>

const MAX_PREVIEW_WIDTH = 1000;
const MAX_PREVIEW_HEIGHT = 700;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const fileInput = document.getElementById("fileInput");
const decodeBtn = document.getElementById("decodeBtn");
const clearBtn = document.getElementById("clearBtn");

const statusEl = document.getElementById("status");

const resultCard = document.getElementById("resultCard");
const decodedText = document.getElementById("decodedText");
const decodedFormat = document.getElementById("decodedFormat");
const copyBtn = document.getElementById("copyBtn");

const errorBox = document.getElementById("errorBox");

let originalImage = null;
let scaleFactor = 1;
let lastDecodedValue = "";

let selection = null;
let dragging = false;
let startX = 0;
let startY = 0;

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
}

function hideError() {
    errorBox.style.display = "none";
}

function showResult(code, format) {
    lastDecodedValue = code;

    decodedText.textContent = code;
    decodedFormat.textContent = "Format: " + format;

    resultCard.style.display = "block";
}

function hideResult() {
    resultCard.style.display = "none";
}

function redraw() {

    if (!originalImage) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (selection) {

        ctx.fillStyle =
            "rgba(37,99,235,0.15)";

        ctx.strokeStyle =
            "#2563eb";

        ctx.lineWidth = 2;

        ctx.fillRect(
            selection.x,
            selection.y,
            selection.width,
            selection.height
        );

        ctx.strokeRect(
            selection.x,
            selection.y,
            selection.width,
            selection.height
        );
    }
}

function getPos(e) {

    const rect =
        canvas.getBoundingClientRect();

    const clientX =
        e.touches ? e.touches[0].clientX : e.clientX;

    const clientY =
        e.touches ? e.touches[0].clientY : e.clientY;

    return {
        x:
            (clientX - rect.left)
            * canvas.width
            / rect.width,

        y:
            (clientY - rect.top)
            * canvas.height
            / rect.height
    };
}

fileInput.addEventListener("change", e => {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        const img = new Image();

        img.onload = () => {

            originalImage = img;

            scaleFactor = Math.min(
                MAX_PREVIEW_WIDTH / img.width,
                MAX_PREVIEW_HEIGHT / img.height,
                1
            );

            canvas.width =
                Math.round(img.width * scaleFactor);

            canvas.height =
                Math.round(img.height * scaleFactor);

            selection = null;

            redraw();

            hideResult();
            hideError();

            statusEl.textContent =
                `Loaded image: ${img.width} × ${img.height}`;
        };

        img.src = reader.result;
    };

    reader.readAsDataURL(file);
});

function startSelection(e) {

    if (!originalImage) return;

    e.preventDefault();

    const p = getPos(e);

    startX = p.x;
    startY = p.y;

    selection = {
        x: p.x,
        y: p.y,
        width: 0,
        height: 0
    };

    dragging = true;
}

function moveSelection(e) {

    if (!dragging) return;

    e.preventDefault();

    const p = getPos(e);

    selection = {
        x: Math.min(startX, p.x),
        y: Math.min(startY, p.y),
        width: Math.abs(p.x - startX),
        height: Math.abs(p.y - startY)
    };

    redraw();
}

function stopSelection() {
    dragging = false;
}

canvas.addEventListener("mousedown", startSelection);
canvas.addEventListener("mousemove", moveSelection);
canvas.addEventListener("mouseup", stopSelection);
canvas.addEventListener("mouseleave", stopSelection);

canvas.addEventListener("touchstart", startSelection, {passive:false});
canvas.addEventListener("touchmove", moveSelection, {passive:false});
canvas.addEventListener("touchend", stopSelection);

clearBtn.addEventListener("click", () => {
    selection = null;
    redraw();
});

function makeCropCanvas(scale = 1) {

    const crop =
        document.createElement("canvas");

    const cropCtx =
        crop.getContext("2d");

    let x = 0;
    let y = 0;
    let w = originalImage.width;
    let h = originalImage.height;

    if (
        selection &&
        selection.width > 10 &&
        selection.height > 10
    ) {

        x = selection.x / scaleFactor;
        y = selection.y / scaleFactor;
        w = selection.width / scaleFactor;
        h = selection.height / scaleFactor;

        const padX = w * 0.15;
        const padY = h * 0.15;

        x = Math.max(0, x - padX);
        y = Math.max(0, y - padY);

        w = Math.min(
            originalImage.width - x,
            w + padX * 2
        );

        h = Math.min(
            originalImage.height - y,
            h + padY * 2
        );
    }

    crop.width = Math.round(w * scale);
    crop.height = Math.round(h * scale);

    cropCtx.imageSmoothingEnabled = false;

    cropCtx.drawImage(
        originalImage,
        x,
        y,
        w,
        h,
        0,
        0,
        crop.width,
        crop.height
    );

    return crop;
}

function decodeCanvas(cropCanvas) {

    return new Promise(resolve => {

        Quagga.decodeSingle({

            src:
                cropCanvas.toDataURL("image/png"),

            numOfWorkers: 0,

            locate: true,

            decoder: {
                readers: [
                    "code_128_reader",
                    "ean_reader",
                    "ean_8_reader",
                    "upc_reader",
                    "upc_e_reader",
                    "code_39_reader",
                    "codabar_reader",
                    "i2of5_reader"
                ]
            }

        }, result => {

            if (
                result &&
                result.codeResult
            ) {
                resolve(result);
            } else {
                resolve(null);
            }
        });
    });
}

async function decodeBarcode() {

    if (!originalImage) {
        showError("Please load an image first.");
        return;
    }

    hideError();
    hideResult();

    decodeBtn.disabled = true;
    decodeBtn.textContent = "Scanning...";

    statusEl.textContent =
        "Scanning barcode...";

    try {

        for (const scale of [1, 2, 3]) {

            const crop =
                makeCropCanvas(scale);

            const result =
                await decodeCanvas(crop);

            if (result) {

                showResult(
                    result.codeResult.code,
                    result.codeResult.format
                );

                statusEl.textContent =
                    "Barcode detected.";

                return;
            }
        }

        showError(
            "No barcode detected. Try selecting a tighter region around the barcode."
        );

        statusEl.textContent =
            "Scan completed.";

    } finally {

        decodeBtn.disabled = false;
        decodeBtn.textContent = "Decode";
    }
}

decodeBtn.addEventListener(
    "click",
    decodeBarcode
);

copyBtn.addEventListener(
    "click",
    async () => {

        if (!lastDecodedValue) return;

        try {

            await navigator.clipboard.writeText(
                lastDecodedValue
            );

        } catch {

            const ta =
                document.createElement(
                    "textarea"
                );

            ta.value =
                lastDecodedValue;

            document.body.appendChild(ta);

            ta.select();

            document.execCommand("copy");

            ta.remove();
        }

        const old =
            copyBtn.textContent;

        copyBtn.textContent =
            "Copied ✓";

        setTimeout(() => {
            copyBtn.textContent = old;
        }, 1500);
    }
);

</script>

</body>
</html>
